<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5d6882;--line:#d5dbe8;--acc:#2f5bea;--accs:#dfe7ff;--ok:#1f9d63;--warn:#e9a100;--cell:#dde3f0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mute:#9aa5c2;--line:#2a3555;--acc:#7b9bff;--accs:#24315c;--ok:#3ecf8e;--warn:#f3b93a;--cell:#26314f}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.w{max-width:820px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{font:inherit;font-weight:500;border:0;background:none;color:var(--mute);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
main{padding:20px 0 60px}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px}
.c{aspect-ratio:1;border:0;border-radius:5px;background:var(--cell);cursor:pointer;padding:0}
.cp{background:var(--warn)}.cf{background:var(--ok)}
.c.t{outline:2px solid var(--ink);outline-offset:2px}.c.s{box-shadow:0 0 0 2px var(--acc) inset}
.stats{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.legend{font-size:13px;color:var(--mute);display:flex;gap:14px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tk{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.tk:first-of-type{border-top:0}
.tk input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.tk span{display:block}.tk em{display:block;font-style:normal;color:var(--mute);font-size:15px}
.tk i{font-style:normal;color:var(--mute);font-size:13px;margin-left:6px}
.tk.d b,.tk.d em{text-decoration:line-through;opacity:.55}
.bn{background:var(--accs);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:15px}
button.b,label.b{font:inherit;font-weight:500;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;display:inline-block}
@media(prefers-color-scheme:dark){button.b,label.b{color:#0e1424}}
button.g,label.g{background:none;color:var(--ink);border:1px solid var(--line)}
button.x{color:#d64545}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pn{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:0 14px}
summary{padding:12px 0;cursor:pointer;font-weight:500;display:flex;justify-content:space-between;gap:8px}
summary small{color:var(--mute);font-weight:400}
.dl{display:grid;gap:6px;padding:0 0 12px}
.dl button{font:inherit;text-align:left;border:0;background:var(--bg);color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.dz{display:block;border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mute);cursor:pointer;margin-top:12px}
.dz.h{border-color:var(--acc);background:var(--accs)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.f:first-child{border-top:0}.f div:first-child{min-width:0;word-break:break-word}
.f small{color:var(--mute)}
input[type=time]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
p.n{color:var(--mute);font-size:14px;margin:8px 0 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.c{transition:transform .1s}.c:hover{transform:scale(1.12)}}
</style>
</head>
<body>
<header><div class="w">
<div class="top"><div><h1>Study Tracker</h1><div class="sub">8-week frontend internship plan · 9 Nov 2026 – 3 Jan 2027</div></div></div>
<nav id="nav"><button data-v="today">Today</button><button data-v="plan">Full plan</button><button data-v="drive">Project files</button><button data-v="rem">Reminders</button></nav>
</div></header>
<main class="w" id="m"></main>
<script>
const W=[
['HTML + CSS + Internet + Git','HTML, CSS, Flexbox and Grid',[
['How the Internet works, DNS, HTTP, HTTPS','Explain the browser-to-server request flow in your own words','Create the project folder and set up Git'],
['Semantic HTML, document structure','Build a semantic webpage','Portfolio structure'],
['HTML forms, inputs, validation','Create a registration form','Portfolio contact form'],
['CSS Flexbox, alignment, positioning','Recreate 3 layouts','Portfolio navigation'],
['CSS Grid, responsive design, media queries','Make desktop and mobile layouts','Portfolio responsive sections'],
['Accessibility and SEO basics','Labels, alt text, heading structure','Improve portfolio accessibility'],
['Revise HTML/CSS and Git','Build one responsive page independently','Week 1 checkpoint']]],
['JavaScript fundamentals','JavaScript fundamentals',[
['Variables, data types, operators','20 basic JS problems','Calculator logic'],
['if/else, switch, loops','Number guessing exercises','Calculator interface'],
['Functions, scope, arrow functions','10 function problems','Calculator operations'],
['Arrays, objects, destructuring','Student marks management','Expense data structure'],
['map, filter, reduce, forEach','Array transformation problems','Expense calculations'],
['DOM, selectors, events','Build an interactive webpage','Expense tracker UI'],
['Full JS revision','15 JS questions','Complete the expense tracker']]],
['Advanced JavaScript + Browser APIs','ES6, promises and APIs',[
['ES6+, template literals, spread/rest','Convert old JS examples to ES6','Weather UI'],
['Callbacks, promises','Promise exercises','Weather search logic'],
['async/await, try/catch','Handle asynchronous tasks','API connection'],
['Fetch API, JSON','Fetch data from public APIs','Weather results'],
['HTTP methods, status codes, CORS','Test API requests using browser tools','Loading and error states'],
['LocalStorage, sessionStorage','Save and retrieve data','Save favourite cities'],
['DevTools, debugging, revision','Debug a deliberately broken app','Finish the weather application']]],
['Git + npm + React fundamentals','React fundamentals',[
['Git branches, merge, pull, push','GitHub practice repository','Upload previous projects'],
['npm, package.json, Vite, ESLint, Prettier','Create a React project','Task manager setup'],
['JSX and React components','Build reusable components','Task manager layout'],
['Props and component composition','Pass data between components','Task cards'],
['useState, events','Counter and interactive forms','Add tasks'],
['useEffect and component lifecycle','Build a data-fetching component','Task manager state'],
['React revision','Build a small app without a tutorial','Deploy your first React project']]],
['React intermediate','React hooks, routing and state',[
['React Router','Configure routes','Home and tasks pages'],
['Forms and controlled inputs','Form validation','Add/edit task form'],
['Conditional rendering','Empty, loading and error states','Task status indicators'],
['Lists, keys and component reuse','Reusable list components','Task filters'],
['React hooks revision','Custom hook exercise','Reorganize task logic'],
['Context API and state sharing','Shared theme state','Dark/light mode'],
['React practical test','Build a mini application independently','Deploy the complete task manager']]],
['API integration + testing','REST APIs, testing and debugging',[
['REST APIs, GET and POST','Test requests','Dashboard API structure'],
['PUT, PATCH and DELETE','CRUD requests','CRUD functionality'],
['API integration in React','Fetch and display data','Dashboard data'],
['Loading, errors and validation','Handle API failures','Better UX'],
['Vitest and React Testing Library','Write component tests','Test the task manager'],
['Postman and debugging','Test API endpoints','API documentation'],
['Week revision','Build a small CRUD app','Deploy and test']]],
['Major portfolio project: Smart Health & Safety Dashboard','project explanation and UX',[
['UX principles, layout hierarchy','Dashboard wireframe and structure','Commit progress to GitHub'],
['React component architecture','Sidebar, navigation, cards','Commit progress to GitHub'],
['Chart libraries and data visualization','Temperature and gas charts','Commit progress to GitHub'],
['Browser APIs and data handling','Connect simulated sensor data (label it as simulated)','Commit progress to GitHub'],
['Accessibility and SEO','Keyboard navigation, labels, metadata','Commit progress to GitHub'],
['Performance optimization','Optimize images, rendering and loading','Commit progress to GitHub'],
['Revision and quality testing','Complete and deploy the dashboard','Write the project documentation']]],
['Internship preparation','mock interview and coding test',[
['TypeScript fundamentals: types, interfaces','Convert a small JS component','Update the README of one project'],
['TypeScript with React','Type props and state','Update the README of one project'],
['Web security basics: HTTPS, CORS, XSS','Review your projects for common issues','Add screenshots to READMEs'],
['Frontend performance and testing','Run Lighthouse and fix issues','Add live links to READMEs'],
['Portfolio design and GitHub README','Complete your portfolio','Check every deployment link works'],
['JavaScript and React interview revision','Mock technical interview','List your weak topics'],
['Resume and application strategy','Final deployment and application preparation','Send applications']]]
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={done:{},rt:'19:00',lt:'21:30',on:true,sent:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('stp')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('stp',JSON.stringify(S))}catch(e){}};
const dayDate=n=>new Date(2026,10,9+n);
const todayIdx=()=>{const t=new Date();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-dayDate(0))/864e5)};
const fd=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const tasks=n=>{const w=W[n/7|0],d=w[2][n%7];return[['Learn',45,d[0]],['Practice',75,d[1]],['Project',40,d[2]],['Interview + GitHub',20,'Practise '+w[1]+' questions, then push today’s code to GitHub']]};
const cnt=n=>[0,1,2,3].filter(k=>S.done['d'+n+'k'+k]).length;
const total=()=>{let s=0;for(let i=0;i<56;i++)s+=cnt(i);return s};
let view='today',cur=Math.min(55,Math.max(0,todayIdx())),dp='All';
const PROJ=['Portfolio','Weather app','Task manager','Health dashboard','Notes & other'];

function vToday(){
 const t=todayIdx(),n=cur,w=W[n/7|0],T=tasks(n),c=cnt(n);let bn='';
 if(t<0)bn=`<div class="bn">Your plan starts in ${-t} day${-t>1?'s':''}, on Monday 9 November. Day 1 is previewed below.</div>`;
 else if(t>55)bn=`<div class="bn">The 8 weeks are over. Keep building and keep applying.</div>`;
 else if(t>=1&&n===t&&cnt(t-1)<4)bn=`<div class="bn">Yesterday has ${4-cnt(t-1)} unfinished task${4-cnt(t-1)>1?'s':''}. <button class="b" data-go="${t-1}" style="margin-left:6px;padding:4px 10px">Catch up</button></div>`;
 let g='';for(let i=0;i<56;i++){const k=cnt(i);g+=`<button class="c ${k===4?'cf':k?'cp':''}${i===t?' t':''}${i===n?' s':''}" data-go="${i}" aria-label="Day ${i+1}, ${k} of 4 done"></button>`}
 const tot=total();
 return `<div class="stats"><div><div class="big">${tot}<span class="sub" style="font-size:18px;font-weight:500"> / 224 tasks</span></div><div class="sub">${Math.round(tot/2.24)}% of the plan done</div></div></div>
 <div class="card"><div class="grid">${g}</div><div class="legend"><span><i style="background:var(--ok)"></i>All done</span><span><i style="background:var(--warn)"></i>Some done</span><span><i style="background:var(--cell)"></i>Not started</span></div></div>
 ${bn}
 <div class="pn"><button class="b g" data-go="${Math.max(0,n-1)}" ${n===0?'disabled':''}>Previous</button><div style="text-align:center"><b>Day ${n+1} of 56</b><div class="sub">${fd(dayDate(n))} · Week ${(n/7|0)+1}</div></div><button class="b g" data-go="${Math.min(55,n+1)}" ${n===55?'disabled':''}>Next</button></div>
 <div class="card"><h2>${esc(w[0])}</h2><div class="sub">${c} of 4 tasks done · 3 hours today</div>
 ${T.map((x,k)=>{const d=S.done['d'+n+'k'+k];return `<label class="tk${d?' d':''}"><input type="checkbox" data-k="${k}" ${d?'checked':''}><span><b>${x[0]}</b><i>${x[1]} min</i><em>${esc(x[2])}</em></span></label>`}).join('')}</div>`;
}
function vPlan(){return W.map((w,i)=>{let s=0;for(let j=0;j<7;j++)s+=cnt(i*7+j);return `<details ${i===(cur/7|0)?'open':''}><summary><span>Week ${i+1}: ${esc(w[0])}</span><small>${fd(dayDate(i*7))} – ${fd(dayDate(i*7+6))} · ${s}/28</small></summary><div class="dl">${w[2].map((d,j)=>{const n=i*7+j,k=cnt(n);return `<button data-go="${n}"><span>${fd(dayDate(n))} · ${esc(d[0])}</span><span>${k===4?'✓ done':k+'/4'}</span></button>`}).join('')}</div></details>`}).join('')}

const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('stdrive',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const dbx=async(m,fn)=>{const db=await DB;return new Promise((res,rej)=>{const t=db.transaction('f',m),r=fn(t.objectStore('f'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const all=()=>dbx('readonly',s=>s.getAll());
const sz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
async function addFiles(list){const proj=dp==='All'?'Notes & other':dp,ex=await all();for(const f of list){const o=ex.find(x=>x.p===proj&&x.n===f.name),rec={p:proj,n:f.name,s:f.size,b:f,v:o?o.v+1:1,u:Date.now()};if(o)rec.id=o.id;await dbx('readwrite',s=>s.put(rec))}}
async function vDrive(){
 let list=[],err='';try{list=await all()}catch(e){err='Your browser blocked file storage here (private mode?). Open the site in a normal window.'}
 const shown=list.filter(x=>dp==='All'||x.p===dp).sort((a,b)=>b.u-a.u);
 return `<h2>Project files</h2><div class="sub">Upload, update and download your project files. Stored in this browser on this device.</div>
 <div class="chips">${['All',...PROJ].map(p=>`<button class="${p===dp?'on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
 <label class="dz" id="dz">Drop files here or tap to browse<br><small>Saving to: ${dp==='All'?'Notes &amp; other (pick a project above to file elsewhere)':esc(dp)}</small><input type="file" id="fi" multiple hidden></label>
 <p class="n">Uploading a file with the same name in the same project replaces it and raises its version number.</p>${err?`<div class="bn">${err}</div>`:''}
 <div class="card">${shown.length?shown.map(x=>`<div class="f"><div><b>${esc(x.n)}</b><br><small>${esc(x.p)} · v${x.v} · ${sz(x.s)} · ${new Date(x.u).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</small></div><div class="row"><button class="b g" data-act="dl" data-id="${x.id}">Download</button><label class="b g">Update<input type="file" hidden data-rep="${x.id}"></label><button class="b g x" data-act="del" data-id="${x.id}">Delete</button></div></div>`).join(''):'<div class="sub">No files yet. Drop your first project file above.</div>'}</div>`;
}
function vRem(){
 const p='Notification'in window?Notification.permission:'unsupported';
 return `<h2>Reminders</h2><div class="sub">Get nudged until all four tasks for the day are ticked.</div>
 <div class="card"><label class="row"><input type="checkbox" id="on" ${S.on?'checked':''} style="width:20px;height:20px"> <b>Send reminders while this page is open</b></label>
 <div class="row" style="margin-top:14px"><label>Daily reminder <input type="time" id="rt" value="${S.rt}"></label><label>Last call if still unfinished <input type="time" id="lt" value="${S.lt}"></label></div>
 <div class="row" style="margin-top:14px">${p==='granted'?'<span class="sub">Notifications are allowed ✓</span>':p==='denied'?'<span class="sub">Notifications are blocked. Allow them in your browser’s site settings.</span>':p==='unsupported'?'<span class="sub">This browser has no notification support.</span>':'<button class="b" data-act="perm">Allow notifications</button>'}${p==='granted'?'<button class="b g" data-act="test">Send a test</button>':''}</div>
 <p class="n">Browser notifications only fire while this tab is open or the installed app is running. They can’t wake a closed browser.</p></div>
 <div class="card"><b>Reminders that work when the browser is closed</b><p class="n" style="margin-top:4px">Download a calendar file with all 56 study sessions and a 10-minute alert, then open it in Google, Apple or Outlook Calendar. It uses your daily reminder time above.</p><div style="margin-top:12px"><button class="b" data-act="ics">Download calendar file (.ics)</button></div></div>`;
}
function ics(){const[h,m]=S.rt.split(':').map(Number),p=x=>String(x).padStart(2,'0'),f=d=>''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
 let o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//StudyTracker//EN'];
 for(let n=0;n<56;n++)o.push('BEGIN:VEVENT','UID:study-'+n+'@tracker','DTSTAMP:20261107T000000Z','DTSTART:'+f(dayDate(n))+'T'+p(h)+p(m)+'00','DURATION:PT3H','SUMMARY:Study Day '+(n+1)+': '+tasks(n)[0][2].replace(/[,;]/g,' '),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Study session','TRIGGER:-PT10M','END:VALARM','END:VEVENT');
 o.push('END:VCALENDAR');dl(new Blob([o.join('\r\n')],{type:'text/calendar'}),'study-plan.ics')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function notify(t,b){try{new Notification(t,{body:b,tag:'study'})}catch(e){}}
function tick(){const t=todayIdx(),c=t>=0&&t<=55?cnt(t):4;document.title=(c<4?'('+(4-c)+') ':'')+'Study Tracker';
 if(!S.on||c===4||!('Notification'in window)||Notification.permission!=='granted')return;
 const now=new Date(),due=[['a',S.rt,'Time to study'],['b',S.lt,'Last call']].filter(([id,tm])=>{const[h,m]=tm.split(':'),at=new Date();at.setHours(+h,+m,0,0);return now>=at&&!S.sent[t+id]});
 if(!due.length)return;due.forEach(d=>S.sent[t+d[0]]=1);save();
 notify(due[due.length-1][2]+' · Day '+(t+1),(4-c)+' of 4 tasks left. Next up: '+tasks(t)[c===0?0:0][2]);}
async function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const h=view==='today'?vToday():view==='plan'?vPlan():view==='rem'?vRem():await vDrive();
 $('#m').innerHTML=h;tick();
}
document.addEventListener('click',async e=>{
 const q=e.target.closest('[data-go],[data-v],[data-p],[data-act]');if(!q)return;
 const d=q.dataset;
 if(d.go!==undefined){cur=+d.go;view='today';render();scrollTo(0,0)}
 else if(d.v){view=d.v;render()}
 else if(d.p){dp=d.p;render()}
 else if(d.act==='perm'){await Notification.requestPermission();render()}
 else if(d.act==='test')notify('Study Tracker','Reminders are working.');
 else if(d.act==='ics')ics();
 else if(d.act==='dl'){const r=(await all()).find(x=>x.id==d.id);if(r)dl(r.b,r.n)}
 else if(d.act==='del'){if(confirm('Delete this file?')){await dbx('readwrite',s=>s.delete(+d.id));render()}}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.k!==undefined){const key='d'+cur+'k'+el.dataset.k;S.done[key]=el.checked;if(!el.checked)delete S.done[key];save();render()}
 else if(el.id==='fi'){await addFiles(el.files);render()}
 else if(el.dataset.rep){const f=el.files[0];if(f){const r=(await all()).find(x=>x.id==el.dataset.rep);await dbx('readwrite',s=>s.put({...r,n:f.name,s:f.size,b:f,v:r.v+1,u:Date.now()}));render()}}
 else if(el.id==='on'){S.on=el.checked;save()}
 else if(el.id==='rt'||el.id==='lt'){if(el.value){S[el.id]=el.value;save()}}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.add('h')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dz'))$('#dz').classList.remove('h')});
document.addEventListener('drop',async e=>{if(e.target.closest('#dz')){e.preventDefault();await addFiles(e.dataTransfer.files);render()}});
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script>
</body>
</html>
